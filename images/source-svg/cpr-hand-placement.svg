<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
<rect width="800" height="600" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
<path d="M0,0 L10,5 L0,10 z" fill="#c8102e"/></marker></defs>
<g stroke="#1d1d1f" stroke-width="6" stroke-linecap="round" stroke-linejoin="round">

<line x1="40" y1="500" x2="760" y2="500" stroke="#bfb6ad" stroke-width="8"/>
<!-- rescuer (behind the person) -->
<path d="M405,330 L440,470 L540,470" fill="none" stroke="#4b5563" stroke-width="44"/>
<rect x="320" y="200" width="100" height="150" rx="40" fill="#7d9fc9" transform="rotate(-12 370 275)"/>
<circle cx="335" cy="150" r="42" fill="#f3d6bf"/>
<line x1="345" y1="215" x2="345" y2="400" stroke="#1d1d1f" stroke-width="40"/><line x1="345" y1="215" x2="345" y2="400" stroke="#f3d6bf" stroke-width="30"/>
<!-- person lying on their back -->
<circle cx="150" cy="455" r="42" fill="#f3d6bf"/>
<rect x="190" y="415" width="300" height="80" rx="34" fill="#9fb8d8"/>
<rect x="480" y="430" width="270" height="60" rx="28" fill="#4b5563"/>
<!-- stacked hands on the center of the chest -->
<ellipse cx="345" cy="410" rx="44" ry="16" fill="#e8bf9f"/>
<ellipse cx="345" cy="396" rx="40" ry="15" fill="#f3d6bf"/>
<line x1="250" y1="230" x2="250" y2="380" stroke="#c8102e" stroke-width="10" marker-end="url(#arrow)"/>
<text x="250" y="205" font-family="DejaVu Sans, Arial, sans-serif" font-weight="700" font-size="34" text-anchor="middle" fill="#c8102e" stroke="none">PUSH</text>
<line x1="420" y1="560" x2="360" y2="425" stroke="#1d1d1f" stroke-width="3"/>
<text x="430" y="580" font-family="DejaVu Sans, Arial, sans-serif" font-weight="700" font-size="30" text-anchor="start" fill="#1d1d1f" stroke="none">Center of the chest</text>

</g></svg>