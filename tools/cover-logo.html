<!doctype html><html><head><meta charset="utf-8"><style>
*{margin:0;box-sizing:border-box}
body{width:600px;height:800px;overflow:hidden;background:#161616;color:#ececec;position:relative;
 font-family:-apple-system,"Segoe UI",Roboto,Inter,Helvetica,Arial,sans-serif}
.glow{position:absolute;inset:0;background:radial-gradient(circle at 50% 46%,rgba(200,16,46,.28),rgba(200,16,46,0) 55%)}
.wrap{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
svg{display:block;width:600px}
h1{font-weight:900;font-size:150px;line-height:.95;letter-spacing:-4px;text-align:center}
.b{margin-top:-10px}
</style></head><body>
<div class="glow"></div>
<div class="wrap">
 <h1>Minute</h1>
 <svg viewBox="0 0 600 120" height="120"><path d="M0 60 H230 L256 18 L290 104 L318 30 L338 60 H600" fill="none" stroke="#c8102e" stroke-width="10" stroke-linejoin="round" stroke-linecap="round"/></svg>
 <h1 class="b">Zero</h1>
</div>
</body></html>
